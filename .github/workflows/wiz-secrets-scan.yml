name: Wiz Custom Secret Detection Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  wiz-secret-scan:
    name: Wiz CLI NATS Custom Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Wiz CLI v1
        run: |
          curl -sSL -o wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli
          sudo mv wizcli /usr/local/bin/wizcli

      - name: Run Wiz CLI Directory Scan (NATS Custom Secret Policy)
        id: wiz_scan
        continue-on-error: true
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          mkdir -p reports
          wizcli scan dir . \
            --name "gha-nats-custom-secrets-${{ github.run_id }}" \
            --policies "sr-nats-custom-secrets-policy" \
            --disabled-scanners Vulnerability,SensitiveData,Misconfiguration,SoftwareSupplyChain,AIModels,SAST,Malware \
            --json-output-file reports/wiz-scan.json \
            --sarif-output-file reports/wiz-scan.sarif

      - name: Upload Wiz Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiz-secret-scan-reports
          path: reports/
